[project]
name = "vitalos-verify"
version = "0.1.0"
description = "Vitalos Verify API and worker (pre-pilot prototype; synthetic data and dummy provider only)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "psycopg[binary,pool]>=3.2",
  "cryptography>=43",
  "jsonschema>=4.23",
  "httpx>=0.27",
  "pyjwt[crypto]>=2.10",
  "boto3>=1.35",
]

[project.scripts]
vv-api = "vv.api.app:main"
vv-worker = "vv.worker:main"
vv-admin = "vv.admin:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S", "UP"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S311", "S104", "S608"]
"tests/test_verifier_*" = ["S105", "S106", "S311", "S104", "S608", "E501", "B023", "F841"]
