name: ci

on:
  pull_request:
  push:
    branches: [main, "claude/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spec-pack:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install "jsonschema==4.23.0" && python -I docs/spec/validate_pack.py

  api:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      VV_ENV: ci
      PGPASSWORD: postgres_ci_only
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { enable-cache: true, cache-dependency-glob: services/api/uv.lock }
      - run: uv python install 3.13
      - run: psql -h localhost -U postgres -f ../../scripts/init-db.sql
      - run: uv sync --frozen
      - run: uv run ruff check src tests
      - run: uv run pytest -p no:cacheprovider
      - name: Secret scan (tracked files)
        working-directory: .
        run: |
          ! git grep -nE '(AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----|vvk_live_[A-Za-z0-9_-]{20,}|sk_live_[A-Za-z0-9]{10,})' -- . ':!services/api/tests'
